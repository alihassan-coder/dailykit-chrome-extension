<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolbelt logo options</title>
<style>
:root { --ink: #1f2328; --accent: #0b57d0; --soft: #d3e3fd; }
* { box-sizing: border-box; }
body { margin: 0; padding: 28px; background: #eef0f2; font: 13px/1.4 system-ui, 'Segoe UI', Roboto, Ubuntu, sans-serif; color: #1f2328; }
h1 { margin: 0 0 4px; font-size: 18px; }
p.lead { margin: 0 0 22px; color: #5f6368; }
.options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.card { background: #fff; border-radius: 14px; padding: 18px; display: grid; gap: 14px; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
.card h2 { margin: 0; font-size: 15px; }
.card .why { color: #5f6368; font-size: 12.5px; min-height: 52px; }
.hero { height: 150px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(#f8f9fa, #eef1f5); }
.sizes { display: flex; align-items: flex-end; gap: 14px; }
.sizes .tile { display: grid; place-items: center; border-radius: 8px; }
.dark { background: #1f1f1f; }
.toolbar { display: flex; align-items: center; gap: 10px; background: #dfe3e8; border-radius: 8px; padding: 6px 10px; color: #5f6368; font-size: 11px; }
.toolbar .dot { width: 16px; height: 16px; border-radius: 4px; background: #c4c9cf; }
.letter { font-weight: 700; font-size: 18px; color: var(--accent); }
</style>
</head>
<body>
<h1>Toolbelt logo options</h1>
<p class="lead">Each shown large, then at the real toolbar sizes (32 px and 16 px), on light and dark, and in Chrome's toolbar next to other icons.</p>

<svg width="0" height="0" style="position:absolute">
	<!-- A · Buckle: a belt buckle around a strap; the prong is the accent. -->
	<symbol id="a" viewBox="0 0 32 32">
		<rect x="2" y="12" width="28" height="8" rx="2.5" fill="var(--ink)" opacity=".18"/>
		<rect x="7" y="6" width="18" height="20" rx="5" fill="none" stroke="var(--ink)" stroke-width="3.2"/>
		<rect x="14.4" y="9.5" width="3.2" height="13" rx="1.6" fill="var(--accent)"/>
	</symbol>
	<!-- B · T-strap: the letter T made of a belt strap (crossbar) and buckle prong (stem). -->
	<symbol id="b" viewBox="0 0 32 32">
		<rect x="3" y="5" width="26" height="7.5" rx="3.75" fill="var(--ink)"/>
		<circle cx="9" cy="8.75" r="1.3" fill="#fff" opacity=".9"/><circle cx="15" cy="8.75" r="1.3" fill="#fff" opacity=".9"/><circle cx="21" cy="8.75" r="1.3" fill="#fff" opacity=".9"/>
		<rect x="12.5" y="12.5" width="7" height="16" rx="3.5" fill="var(--accent)"/>
	</symbol>
	<!-- C · Tool pouch: a belt pouch with a tool handle and a pipette tip peeking out. -->
	<symbol id="c" viewBox="0 0 32 32">
		<rect x="11" y="3" width="3.6" height="12" rx="1.8" fill="var(--accent)" transform="rotate(-12 12.8 9)"/>
		<rect x="17.6" y="4" width="3" height="11" rx="1.5" fill="var(--ink)" opacity=".55" transform="rotate(14 19 9.5)"/>
		<path d="M6 13h20v9a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6v-9Z" fill="var(--ink)"/>
		<path d="M6 13h20v3H6z" fill="var(--ink)" opacity=".6"/>
		<path d="M10 20h12" stroke="#fff" stroke-width="1.4" stroke-dasharray="2 2" opacity=".6"/>
	</symbol>
	<!-- D · Belt loop: a ring of the belt holding three tool marks, like tools clipped around a waist. -->
	<symbol id="d" viewBox="0 0 32 32">
		<path d="M5 13.5c0-2.5 4.9-4.5 11-4.5s11 2 11 4.5" fill="none" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round"/>
		<rect x="7.5" y="15" width="4" height="11" rx="2" fill="var(--ink)" opacity=".55"/>
		<rect x="14" y="15" width="4" height="13" rx="2" fill="var(--accent)"/>
		<rect x="20.5" y="15" width="4" height="9" rx="2" fill="var(--ink)" opacity=".55"/>
	</symbol>
</svg>

<div class="options" id="options"></div>

<script>
const OPTIONS = [
	['a', 'A · Buckle', 'A belt buckle around its strap. Instantly reads as “belt”; the blue prong is the one bold detail. Very clear at 16 px.'],
	['b', 'B · T-strap', 'The letter T built from a belt strap (with holes) and a buckle prong. Name and object in one mark.'],
	['c', 'C · Tool pouch', 'A belt pouch with tools peeking out: your own tools, carried with you. Most literal, a little busier when small.'],
	['d', 'D · Clipped tools', 'A curve of belt with three tools hanging from it; the middle one (blue) is the tool you are using.']
];
const icon = (id, size, dark) => `<svg width="${size}" height="${size}" style="${dark ? '--ink:#e3e3e3;--accent:#a8c7fa' : ''}"><use href="#${id}"/></svg>`;
document.getElementById('options').innerHTML = OPTIONS.map(([id, name, why]) => `
	<div class="card">
		<h2>${name}</h2>
		<div class="hero">${icon(id, 112)}</div>
		<div class="why">${why}</div>
		<div class="sizes">
			<div class="tile" style="width:48px;height:48px;background:#f1f3f4">${icon(id, 32)}</div>
			<div class="tile" style="width:28px;height:28px;background:#f1f3f4">${icon(id, 16)}</div>
			<div class="tile dark" style="width:48px;height:48px">${icon(id, 32, true)}</div>
			<div class="tile dark" style="width:28px;height:28px">${icon(id, 16, true)}</div>
		</div>
		<div class="toolbar"><span class="dot"></span><span class="dot"></span>${icon(id, 16)}<span class="dot"></span><span style="margin-left:auto">Chrome toolbar</span></div>
	</div>`).join('');
</script>
</body>
</html>
