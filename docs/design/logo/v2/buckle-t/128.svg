<radialGradient id="btAmb" cx="64" cy="81" r="12" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFC53D" stop-opacity=".9"/><stop offset="1" stop-color="#FFC53D" stop-opacity="0"/></radialGradient>
</defs>
