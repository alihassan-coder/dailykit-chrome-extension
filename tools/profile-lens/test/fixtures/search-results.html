<!doctype html>
<!-- People search results (linkedin.com/search/results/people/?keywords=growth), with one result selected,
     and the viewer's own card in the sidebar, which must not be offered. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Search | LinkedIn</title>
	</head>
	<body>
		<header id="global-nav" class="global-nav"><a href="https://www.linkedin.com/in/viewer-me/">Me</a></header>
		<main class="scaffold-layout__main">
			<div class="feed-identity-module">
				<a href="https://www.linkedin.com/in/viewer-me/"><span aria-hidden="true">Viewer Person</span></a>
			</div>
			<ul class="reusable-search__entity-result-list">
				<li class="reusable-search__result-container">
					<a href="https://www.linkedin.com/in/alex-kim-42?miniProfileUrn=urn%3Ali%3Afs_miniProfile%3A1">
						<span aria-hidden="true">Alex Kim</span><span class="visually-hidden">View Alex Kim’s profile</span>
					</a>
					<div>VP Sales at Northwind</div>
				</li>
				<li class="reusable-search__result-container" aria-current="true">
					<a href="https://www.linkedin.com/in/jane-doe?miniProfileUrn=urn%3Ali%3Afs_miniProfile%3A2">
						<span aria-hidden="true">Jane Doe</span><span class="visually-hidden">View Jane Doe’s profile</span>
					</a>
					<a href="https://www.linkedin.com/in/jane-doe?miniProfileUrn=urn%3Ali%3Afs_miniProfile%3A2"
						><img alt="Jane Doe" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
					/></a>
					<div>Head of Growth at Acme</div>
				</li>
				<li class="reusable-search__result-container">
					<a href="/in/j%C3%BCrgen-m"><span aria-hidden="true">Jürgen Müller</span></a>
				</li>
			</ul>
		</main>
	</body>
</html>
