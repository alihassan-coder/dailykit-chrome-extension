<!doctype html>
<!-- LinkedIn's sign-in wall (linkedin.com/authwall?...&sessionRedirect=...), shown instead of a profile when signed out. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Sign Up | LinkedIn</title>
	</head>
	<body>
		<nav class="nav">
			<a class="nav__button-secondary" href="https://www.linkedin.com/login?session_redirect=x">Sign in</a>
			<a class="nav__button-primary" href="https://www.linkedin.com/signup">Join now</a>
		</nav>
		<main class="main" id="main-content">
			<section class="authwall-join-form">
				<h2>Sign in to view Jane’s full profile</h2>
				<form class="join-form">
					<label>Email or phone<input type="text" name="session_key" /></label>
					<label>Password<input type="password" name="session_password" /></label>
					<button type="submit">Sign in</button>
				</form>
			</section>
		</main>
	</body>
</html>
