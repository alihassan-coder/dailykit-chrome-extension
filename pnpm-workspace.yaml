packages:
  - apps/*
  - packages/*
  - tools/*

# Install scripts are opt-in (pnpm blocks unknown ones). List every decision here.
allowBuilds:
  esbuild: true
  unrs-resolver: false
  # A mem0ai peer pnpm installs automatically; Toolbelt never uses it (aliased to a stub in the build).
  better-sqlite3: false

minimumReleaseAgeExclude:
  - '@electric-sql/pglite@0.5.14'
